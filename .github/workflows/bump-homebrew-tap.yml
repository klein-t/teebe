name: Bump Homebrew cask

# When a GitHub Release is published (the manual draft -> publish step), point the
# teebe cask in klein-t/homebrew-tap at the new version and its zip's sha256, so
# `brew install --cask klein-t/tap/teebe` installs the release users just got.
# Drafts never trigger this. workflow_dispatch re-runs it for an existing tag.
#
# Requires a repo secret HOMEBREW_TAP_TOKEN: a fine-grained token scoped to
# klein-t/homebrew-tap only, with Contents: read and write. Without it the job
# skips with a notice instead of failing.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Published release tag to put in the cask (e.g. v0.8.1)"
        required: true

permissions:
  contents: read

jobs:
  bump:
    name: Update Casks/teebe.rb
    if: github.event_name == 'workflow_dispatch' || !github.event.release.prerelease
    runs-on: ubuntu-latest
    steps:
      - name: Update version and sha256 in klein-t/homebrew-tap
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          REPO_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          set -euo pipefail
          if [ -z "$TAP_TOKEN" ]; then
            echo "::notice title=Homebrew tap not updated::HOMEBREW_TAP_TOKEN is not set, skipping the cask bump."
            exit 0
          fi
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Unexpected tag '$TAG', expected vX.Y.Z."
            exit 1
          fi
          VERSION="${TAG#v}"

          GH_TOKEN="$REPO_TOKEN" gh release download "$TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern "teebe-${TAG}.zip" --dir dl
          SHA256=$(sha256sum "dl/teebe-${TAG}.zip" | cut -d ' ' -f 1)
          echo "teebe-${TAG}.zip sha256: ${SHA256}"

          export GH_TOKEN="$TAP_TOKEN"
          gh auth setup-git
          git clone --depth 1 https://github.com/klein-t/homebrew-tap.git tap
          cd tap
          sed -i -E \
            -e "s/^  version \"[^\"]*\"$/  version \"${VERSION}\"/" \
            -e "s/^  sha256 \"[^\"]*\"$/  sha256 \"${SHA256}\"/" \
            Casks/teebe.rb
          grep -q "^  version \"${VERSION}\"$" Casks/teebe.rb
          grep -q "^  sha256 \"${SHA256}\"$" Casks/teebe.rb
          if git diff --quiet; then
            echo "Casks/teebe.rb is already at ${VERSION}; nothing to push."
            exit 0
          fi
          git diff
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -am "chore(teebe): update to ${VERSION}"
          git push
