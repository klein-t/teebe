name: Publish appcast

# When a GitHub Release is published (the manual draft -> publish step that ships
# an update), copy that release's signed appcast.xml into the teebe-site repo so
# Sparkle's feed at https://teebe.io/appcast.xml tracks the newest published
# version. The .app zip enclosures the appcast points at stay on GitHub Releases;
# only the feed XML lives on our domain. The same commit mirrors CHANGELOG.md and
# sets the homepage's version to the released one.
#
# Requires a repo secret SITE_DEPLOY_KEY: the private half of an SSH deploy key
# whose public half is installed on klein-t/teebe-site with write access. A
# deploy key is scoped to that one repo and is not tied to a user account, so its
# blast radius is exactly "can push to teebe-site" and nothing else.
on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  publish:
    name: Push appcast.xml to teebe-site
    runs-on: ubuntu-latest
    steps:
      - name: Download appcast.xml from the published release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern 'appcast.xml' --output appcast.xml --clobber
          echo "Downloaded appcast.xml for $TAG:"
          cat appcast.xml

      - name: Fetch CHANGELOG.md at the released tag
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          # Mirror the changelog onto the site so the changelog page can read it
          # same-origin. CHANGELOG.md in the app repo stays the single source.
          gh api "repos/$GITHUB_REPOSITORY/contents/CHANGELOG.md?ref=$TAG" \
            -H "Accept: application/vnd.github.raw" > CHANGELOG.md || true
          head -5 CHANGELOG.md || true

      - name: Check out teebe-site
        uses: actions/checkout@v7
        with:
          repository: klein-t/teebe-site
          ssh-key: ${{ secrets.SITE_DEPLOY_KEY }}
          path: site

      - name: Commit appcast + changelog + homepage version if changed
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          cp appcast.xml site/appcast.xml
          [ -s CHANGELOG.md ] && cp CHANGELOG.md site/CHANGELOG.md
          cd site
          # The homepage states the version in its JSON-LD and in the footer's
          # static text (crawlers read the raw HTML, not the script that refreshes
          # the footer from the appcast). A miss only warns: it must never block
          # the appcast, which is what ships the update.
          V="${TAG#v}"
          if sed -E \
               -e "s/(\"softwareVersion\": \")[^\"]*\"/\1${V}\"/" \
               -e "s/(<span id=\"version\">v)[^ <]*/\1${V}/" \
               index.html > index.html.new \
             && mv index.html.new index.html \
             && grep -qF "\"softwareVersion\": \"${V}\"" index.html \
             && grep -qF "<span id=\"version\">v${V}" index.html; then
            echo "Homepage version set to ${V}."
          else
            rm -f index.html.new
            echo "::warning::Could not set the teebe.io homepage version to ${V}; update index.html by hand."
          fi
          if git diff --quiet -- appcast.xml CHANGELOG.md index.html; then
            echo "appcast.xml, CHANGELOG.md and index.html unchanged; nothing to publish."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add appcast.xml CHANGELOG.md
          if [ -f index.html ]; then git add index.html; fi
          git commit -m "Publish appcast + changelog for ${TAG}"
          git push
